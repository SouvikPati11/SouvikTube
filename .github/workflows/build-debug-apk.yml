name: Build Debug APK

# Builds the SouvikTube Android Debug APK (fullDebug variant) in GitHub's
# cloud. No signing secrets are required: debug builds are signed with the
# standard Android debug key that Gradle generates automatically.
#
# The resulting APK is uploaded as a downloadable Actions artifact named
# "SouvikTube-v1.0.0-debug".

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'assets/**'
      - 'components/**'
      - 'content/**'
      - 'lib/**'
      - 'modules/**'
      - 'plugins/**'
      - 'states/**'
      - 'app.config.ts'
      - 'babel.config.js'
      - 'index.js'
      - 'metro.config.js'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/build-debug-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build SouvikTube Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          bun link
          bun install --frozen-lockfile

      - name: Bundle content scripts
        # Required by the project (see .github/workflows/build.yml): generates
        # assets/scripts/main.bjs, which the app injects into YouTube pages.
        run: bun bundle:es

      - name: Generate Android project (Expo prebuild)
        run: bun expo prebuild -p android --clean --no-install

      - name: Verify app identity in generated Android project
        run: |
          set -euo pipefail
          echo "Checking generated android/app/build.gradle ..."
          grep -q "applicationId 'com.souvikpati.souviktube'" android/app/build.gradle
          grep -q 'versionName "1.0.0"' android/app/build.gradle
          echo "Checking generated app name (strings.xml) ..."
          grep -rq "SouvikTube" android/app/src/main/res/values/strings.xml
          echo "App identity verified: com.souvikpati.souviktube / 1.0.0 / SouvikTube"

      - name: Build Debug APK (fullDebug variant)
        working-directory: android
        run: ./gradlew assembleFullDebug --no-daemon

      - name: Verify APK was generated
        run: |
          set -euo pipefail
          APK_DIR="android/app/build/outputs/apk/full/debug"
          echo "Looking for APK(s) in $APK_DIR ..."
          ls -lh "$APK_DIR"
          if ! ls "$APK_DIR"/*.apk >/dev/null 2>&1; then
            echo "::error::Debug APK was not generated in $APK_DIR"
            exit 1
          fi
          echo "Generated APK(s):"
          ls -lh "$APK_DIR"/*.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SouvikTube-v1.0.0-debug
          path: android/app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 30
