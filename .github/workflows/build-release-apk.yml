name: Build Release APK

# Builds the Tou2 Android Release APK (fullRelease variant) in GitHub's cloud.
#
# Signing: if the repository secrets ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD are
# set, the APK is signed with that release keystore. Otherwise Gradle builds
# an UNSIGNED APK (app-full-*-release-unsigned.apk), which is uploaded under
# an artifact name ending in "-unsigned": it is a release *compilation* proof
# only and cannot be installed as a normal release. Never commit a keystore
# or a password to the repository; the keystore below is decoded from a
# secret at build time and deleted again before the job ends.
#
# The resulting APKs are uploaded as a downloadable Actions artifact named
# "Tou2-v1.0.0-release" (signed) or "Tou2-v1.0.0-release-unsigned" (unsigned).

on:
  workflow_dispatch:

jobs:
  build-release-apk:
    name: Build Tou2 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          bun link
          bun install --frozen-lockfile

      - name: Bundle content scripts
        # Required by the project (see .github/workflows/build.yml): generates
        # assets/scripts/main.bjs, which the app injects into YouTube pages.
        run: bun bundle:es

      - name: Generate Android project (Expo prebuild)
        run: bun expo prebuild -p android --clean --no-install

      - name: Verify app identity in generated Android project
        run: |
          set -euo pipefail
          echo "Checking generated android/app/build.gradle ..."
          grep -q "applicationId 'com.souvikpati.souviktube'" android/app/build.gradle
          grep -q 'versionName "1.0.0"' android/app/build.gradle
          echo "Checking generated app name (strings.xml) ..."
          grep -rq "Tou2" android/app/src/main/res/values/strings.xml
          echo "Checking adaptive icon background and foreground ..."
          grep -q '#26222c' android/app/src/main/res/values/colors.xml
          grep -q '@mipmap/ic_launcher_foreground' android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          echo "App identity verified: com.souvikpati.souviktube / 1.0.0 / Tou2"

      - name: Set up release keystore from secrets
        # Skipped when the secrets are absent: the build then produces an
        # unsigned APK and the artifact name says so (see Detect step).
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/tou2-release.keystore
          {
            echo "TOU2_KEYSTORE_FILE=$PWD/android/tou2-release.keystore"
            echo "TOU2_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "TOU2_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "TOU2_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"
          echo "Release keystore configured from secrets."

      - name: Build Release APK (fullRelease variant)
        working-directory: android
        run: ./gradlew assembleFullRelease --no-daemon

      - name: Detect signed vs unsigned APKs
        id: detect
        run: |
          set -euo pipefail
          APK_DIR="android/app/build/outputs/apk/full/release"
          echo "Looking for APK(s) in $APK_DIR ..."
          ls -lh "$APK_DIR"
          # Signed per-ABI APKs are named app-full-<abi>-release.apk; unsigned
          # ones are app-full-<abi>-release-unsigned.apk.
          if ls "$APK_DIR"/*.apk >/dev/null 2>&1; then
            SIGNED_COUNT=$(ls "$APK_DIR"/*.apk | grep -v 'release-unsigned\.apk' | wc -l)
            UNSIGNED_COUNT=$(ls "$APK_DIR"/*-release-unsigned.apk 2>/dev/null | wc -l)
          else
            echo "::error::Release APK was not generated in $APK_DIR"
            exit 1
          fi
          if [ "$SIGNED_COUNT" -gt 0 ] && [ "$UNSIGNED_COUNT" -eq 0 ]; then
            echo "signing=signed" >> "$GITHUB_OUTPUT"
            echo "artifact_name=Tou2-v1.0.0-release" >> "$GITHUB_OUTPUT"
            echo "Release APK is SIGNED ($SIGNED_COUNT file(s))."
          elif [ "$UNSIGNED_COUNT" -gt 0 ] && [ "$SIGNED_COUNT" -eq 0 ]; then
            echo "signing=unsigned" >> "$GITHUB_OUTPUT"
            echo "artifact_name=Tou2-v1.0.0-release-unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::Release APK is UNSIGNED ($UNSIGNED_COUNT file(s)): no release keystore secrets are configured, so this artifact cannot be installed as a normal release."
          else
            echo "::error::Mixed signed ($SIGNED_COUNT) and unsigned ($UNSIGNED_COUNT) APKs; refusing to publish an ambiguous artifact."
            exit 1
          fi

      - name: Verify APK signing status
        run: |
          set -euo pipefail
          APK_DIR="android/app/build/outputs/apk/full/release"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | head -n 1 || true)
          if [ "${{ steps.detect.outputs.signing }}" = "signed" ]; then
            if [ -n "$APKSIGNER" ]; then
              for apk in "$APK_DIR"/*.apk; do
                echo "Verifying $apk ..."
                "$APKSIGNER" verify --print-certs "$apk"
              done
            else
              echo "::warning::apksigner not found; signature could not be verified in this job."
            fi
          else
            echo "Unsigned artifact: skipping signature verification by design."
            AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | head -n 1 || true)
            if [ -n "$AAPT2" ]; then
              for apk in "$APK_DIR"/*.apk; do
                "$AAPT2" dump badging "$apk" | grep -E "package:|application-label:" || true
              done
            fi
          fi

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.detect.outputs.artifact_name }}
          path: android/app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/tou2-release.keystore
